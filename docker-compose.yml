services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sales_lifecycle}
      POSTGRES_USER: ${POSTGRES_USER:-sales_lifecycle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-sales_lifecycle} -d ${POSTGRES_DB:-sales_lifecycle}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-55434}:5432"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sales_lifecycle}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sales_lifecycle}?schema=public
      LOCAL_STORAGE_ROOT: /app/storage
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - file_storage:/app/storage
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  file_storage:

